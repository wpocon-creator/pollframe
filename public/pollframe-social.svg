    <path d="M20 15h-7v29h7M38 15h7v29h-7" fill="none" stroke="#14171a" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
    <path d="m19 37 10-10 7 5 10-17" fill="none" stroke="#14171a" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5"/>
