<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pollframe – Wahlumfragen für Bund und Länder</title>
  <desc id="desc">Dunkle Pollframe-Vorschaugrafik mit stilisiertem Umfragetrend.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111417"/>
      <stop offset="1" stop-color="#1a1f25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88a4ff"/>
      <stop offset="1" stop-color="#70d3b0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1100" cy="-30" r="310" fill="#7997ff" opacity=".08"/>
  <circle cx="80" cy="670" r="280" fill="#65c4a2" opacity=".055"/>

  <g transform="translate(72 62)">
