    <text y="132" fill="#f7f7f2" font-size="58" font-weight="760" letter-spacing="-2.7">politische Stimmung bewegt.</text>
    <text y="183" fill="#aeb7c0" font-size="22" font-weight="470">Bundestag · alle 16 Bundesländer · historische Trends</text>
