name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-policy:
    name: Build, data, dependencies and policy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Check polling freshness parsing and notification deduplication
        run: node --test tests/uk-supplement.test.mjs tests/watchlist-alerts.test.mjs tests/watchlist-reorder.test.mjs tests/publishing-column-plan.test.mjs tests/loading-performance.test.mjs
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Enforce approval publication withdrawal
        run: node --test tests/approval-withdrawal.test.mjs
      - name: Test API security boundaries and concurrent brute-force protection
        run: node --test tests/worker-security.test.mjs
      - name: Test Studio recipes, real event selection and isolated production accounts
        run: npm run test:studio:unit
      - name: Check Spanish copy and reproducible publication settings
        run: node --test tests/spanish-locale.test.mjs tests/spanish-publication.test.mjs tests/studio-caption.test.mjs tests/history-publication-replay.test.mjs tests/local-launcher.test.mjs
      - name: Validate and build production files
        run: |
          set -euo pipefail
          npm run test:update-pipeline
          npm run check
          git diff --check
      - name: Test publication rights, offline privacy and all logic including built-asset checks
        run: node --test tests/*.test.mjs

  browser-matrix:
    name: Browser and device regressions
    needs: build-and-policy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Install current browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build production files
        run: |
          set -euo pipefail
          npm run build
      # Legacy approval/export scenarios remain in tests/ for the parked feature.
      # The release gate tests the currently published surfaces, not withdrawn data.
      - name: Preserve accessibility, core navigation and responsive layout gates
        run: |
          set -euo pipefail
          npx playwright test tests/accessibility.spec.mjs tests/current-endpoint.spec.mjs tests/event-selection.spec.mjs tests/deferred-content.spec.mjs --project=chromium-desktop --project=firefox-desktop --project=webkit-desktop
          npx playwright test tests/integration.spec.mjs --grep 'shared chart URLs|an explicit language|an explicitly selected|state and autonomous-community maps|legal, contact, privacy' --project=chromium-desktop --project=firefox-desktop --project=webkit-desktop
          npx playwright test tests/mobile-layout.spec.mjs tests/watchlist-visual.spec.mjs --grep-invert approval --project=pixel-5 --project=iphone-13 --project=ipad-mini --project=phone-landscape
          npx playwright test tests/layout-audit.spec.mjs --project=chromium-desktop --project=iphone-13-chromium
      - name: Verify source-preserving designs and actual PNG/embed output in three engines
        run: npx playwright test tests/studio-publication-launch.spec.mjs tests/source-rights-browser.spec.mjs tests/studio-font-export.spec.mjs tests/studio-source-overflow.spec.mjs --project=chromium-desktop --project=firefox-desktop --project=webkit-desktop --workers=2
      - name: Exercise real event editing and data-frame integrity in three engines
        run: npx playwright test tests/studio-events-outcomes.spec.mjs tests/studio-data-fastpath.spec.mjs tests/studio-url-performance.spec.mjs --project=chromium-desktop --project=firefox-desktop --project=webkit-desktop --workers=2
      - name: Check every privacy translation and mobile layout of publication credits
        run: npx playwright test tests/studio-launch-privacy.spec.mjs tests/source-rights-browser.spec.mjs --project=chromium-desktop --project=iphone-13 --project=ipad-mini --workers=2
      - name: Test real offline data, rather than cache-name assumptions
        run: npx playwright test tests/studio-launch-offline.spec.mjs --project=chromium-desktop --project=pixel-5 --workers=2
      - name: Preserve failure screenshots, traces and report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-regression-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
