name: Update polling data

on:
  schedule:
    # Daily at 06:17 UTC. A commit is created only when a source changed.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poll-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Fetch and validate the latest polling data
        run: |
          set -euo pipefail
          npm run data:update
          npm run data:update:uk
          npm run check

      - name: Pass only validated public data to the publishing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-poll-data
          path: |
            public/poll-data.json
            public/regions.json
            public/state-map-data.json
            public/uk-summary.json
            public/data
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download validated polling data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-poll-data
          path: incoming-poll-data

      - name: Install the validated snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp incoming-poll-data/poll-data.json public/poll-data.json
          cp incoming-poll-data/regions.json public/regions.json
          cp incoming-poll-data/state-map-data.json public/state-map-data.json
          cp incoming-poll-data/uk-summary.json public/uk-summary.json
          cp -R incoming-poll-data/data/. public/data/
          node scripts/validate-poll-data.mjs
          git diff --check

      - name: Commit a real data change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/poll-data.json public/regions.json public/state-map-data.json public/uk-summary.json public/data; then
            echo "No polling change found."
            exit 0
          fi

          git config user.name "pollframe-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/poll-data.json public/regions.json public/state-map-data.json public/uk-summary.json public/data
          git commit -m "data: update German and UK polls"
          git push
