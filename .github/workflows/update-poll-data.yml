name: Update polling data

on:
  schedule:
    # Tuesday and Friday at 06:17 UTC (07:17 CET / 08:17 CEST).
    - cron: "17 6 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poll-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Fetch and validate the latest polling data
        run: |
          set -euo pipefail
          npm run data:update
          npm run check

      - name: Pass only validated public data to the publishing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-poll-data
          path: |
            public/poll-data.json
            public/regions.json
            public/state-map-data.json
            public/data
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download validated polling data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-poll-data
          path: incoming-poll-data

      - name: Install the validated snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp incoming-poll-data/poll-data.json public/poll-data.json
          cp incoming-poll-data/regions.json public/regions.json
          cp incoming-poll-data/state-map-data.json public/state-map-data.json
          cp -R incoming-poll-data/data/. public/data/
          node scripts/validate-poll-data.mjs
          git diff --check

      - name: Commit a real data change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/poll-data.json public/regions.json public/state-map-data.json public/data; then
            echo "No federal or state polling change found."
            exit 0
          fi

          git config user.name "pollframe-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/poll-data.json public/regions.json public/state-map-data.json public/data
          git commit -m "data: update federal and state polls"
          git push
