name: Update polling data

on:
  schedule:
    # Check every four hours. A commit is created only when a source changed.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poll-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Install browser for official CIS series
        run: npx playwright install chromium

      # A temporary failure or renamed file at one provider must not prevent the
      # other countries from being published. The health job still turns the
      # overall workflow red after publication so a partial failure is visible.
      - name: Update Germany
        id: germany
        continue-on-error: true
        run: npm run data:update

      - name: Update the United Kingdom
        id: uk
        continue-on-error: true
        run: npm run data:update:uk

      - name: Update Spain
        id: spain
        continue-on-error: true
        env:
          SPAIN_ELECTION_DATE: ${{ vars.SPAIN_ELECTION_DATE }}
        run: npm run data:update:spain

      - name: Update Spanish regions
        id: spain_regions
        continue-on-error: true
        run: npm run data:update:spain-regions

      - name: Update government and leader approval
        id: approval
        continue-on-error: true
        run: npm run data:update:approval

      - name: Validate the complete publishable snapshot
        run: |
          set -euo pipefail
          npm run data:review
          npm run check

      - name: Record every source outcome
        env:
          GERMANY_OUTCOME: ${{ steps.germany.outcome }}
          UK_OUTCOME: ${{ steps.uk.outcome }}
          SPAIN_OUTCOME: ${{ steps.spain.outcome }}
          SPAIN_REGIONS_OUTCOME: ${{ steps.spain_regions.outcome }}
          APPROVAL_OUTCOME: ${{ steps.approval.outcome }}
        run: node scripts/write-update-health.mjs data-update-health.json

      - name: Pass only validated public data to the publishing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-poll-data
          path: |
            public/poll-data.json
            public/regions.json
            public/state-map-data.json
            public/uk-summary.json
            public/spain-summary.json
            public/data
            data-update-health.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download validated polling data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-poll-data
          path: incoming-poll-data

      - name: Install the validated snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp incoming-poll-data/public/poll-data.json public/poll-data.json
          cp incoming-poll-data/public/regions.json public/regions.json
          cp incoming-poll-data/public/state-map-data.json public/state-map-data.json
          cp incoming-poll-data/public/uk-summary.json public/uk-summary.json
          cp incoming-poll-data/public/spain-summary.json public/spain-summary.json
          cp -R incoming-poll-data/public/data/. public/data/
          node scripts/validate-poll-data.mjs
          git diff --check

      - name: Commit a real data change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/poll-data.json public/regions.json public/state-map-data.json public/uk-summary.json public/spain-summary.json public/data; then
            echo "No polling change found."
            exit 0
          fi

          git config user.name "pollframe-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/poll-data.json public/regions.json public/state-map-data.json public/uk-summary.json public/spain-summary.json public/data
          git commit -m "data: update German, UK and Spanish polls"
          git push

  health:
    name: Report partial source failures after publishing healthy data
    needs: [update, publish]
    if: always() && needs.update.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the source health report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-poll-data
          path: incoming-poll-data
      - name: Fail visibly if any provider update failed
        run: node scripts/validate-update-health.mjs incoming-poll-data/data-update-health.json
